version: '3.8'

services:
  # 1. FastAPI Gateway
  api:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
    container_name: crewai_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-mock}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - QDRANT_HOST=qdrant
    depends_on:
      - redis
      - qdrant
    restart: unless-stopped

  # 2. Celery Worker (Background Orchestration)
  worker:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
    container_name: crewai_worker
    command: celery -A src.crewai_core.interfaces.worker.celery_app worker --loglevel=info -c 4
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-mock}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - redis
    restart: unless-stopped

  # 3. Redis Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: crewai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 4. Vector Database (Qdrant) for Long-Term Memory
  qdrant:
    image: qdrant/qdrant:latest
    container_name: crewai_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_data:
