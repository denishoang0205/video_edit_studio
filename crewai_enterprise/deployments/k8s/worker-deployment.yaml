apiVersion: apps/v1
kind: Deployment
metadata:
  name: crewai-worker
  namespace: default
  labels:
    app: crewai-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: crewai-worker
  template:
    metadata:
      labels:
        app: crewai-worker
    spec:
      containers:
      - name: worker
        image: crewai-enterprise:latest
        command: ["celery", "-A", "src.crewai_core.interfaces.worker.celery_app", "worker", "--loglevel=info", "-c", "4"]
        resources:
          limits:
            cpu: "4000m"
            memory: "4096Mi"
          requests:
            cpu: "500m"
            memory: "1024Mi"
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: CELERY_BROKER_URL
          value: "redis://redis-service:6379/0"
