apiVersion: apps/v1
kind: Deployment
metadata:
  name: crewai-api
  namespace: default
  labels:
    app: crewai-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crewai-api
  template:
    metadata:
      labels:
        app: crewai-api
    spec:
      containers:
      - name: api
        image: crewai-enterprise:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "2000m"
            memory: "2048Mi"
          requests:
            cpu: "250m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: DEFAULT_LLM_PROVIDER
          value: "openai"
---
apiVersion: v1
kind: Service
metadata:
  name: crewai-api-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: crewai-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
